[project]
name = "daric"
version = "0.1.0"
description = "Dynamic KV cache reuse and managenent"
authors = [
    {name = "lenovo-ici"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
daric-store = "daric.management.service.main:main"

[project.entry-points."vllm.general_plugins"]
daric = "daric.integration.vllm.plugins:register"

[tool.setuptools.package-data]
daric = ["*.pyi", "py.typed", "integration/vllm/plugins/plugin.env"]

[build-system]
requires = [
    "setuptools>=61.0", 
    "wheel", 
    "ninja",
    "pybind11 == 3.0.1",
    "torch"
]
build-backend = "setuptools.build_meta"
